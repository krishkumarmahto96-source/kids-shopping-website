<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - KidsMart</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-child"></i>
                <span>KidsMart</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="products.html" class="nav-link">Products</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="cart.html" class="nav-link">Cart</a></li>
            </ul>
        </div>
    </nav>

    <!-- Cart Container -->
    <div class="cart-container">
        <h1>Shopping Cart</h1>

        <!-- Cart Items -->
        <div class="cart-content">
            <div class="cart-items" id="cart-items">
                <!-- Cart items will load here -->
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping:</span>
                    <span id="shipping">Free</span>
                </div>
                <div class="summary-row">
                    <span>Discount (10%):</span>
                    <span id="discount">-₹0</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">₹0</span>
                </div>

                <button class="btn btn-primary btn-large" onclick="proceedToCheckout()" style="width: 100%; margin-top: 2rem;">
                    Proceed to Checkout
                </button>
                <button class="btn btn-secondary btn-large" onclick="window.location.href='products.html'" style="width: 100%; margin-top: 1rem;">
                    Continue Shopping
                </button>
            </div>
        </div>

        <!-- Checkout Section -->
        <section class="checkout-section" id="checkout-section" style="display: none;">
            <h2>Checkout</h2>
            <div class="checkout-content">
                <!-- Delivery Address -->
                <div class="checkout-form">
                    <h3>Delivery Address</h3>
                    <form id="delivery-form">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" required placeholder="Enter full name">
                        </div>
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" required placeholder="Enter phone number">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" required placeholder="Enter email">
                        </div>
                        <div class="form-group">
                            <label>Address *</label>
                            <textarea required placeholder="Enter full address"></textarea>
                        </div>
                        <div class="form-group">
                            <label>City *</label>
                            <input type="text" required placeholder="Enter city">
                        </div>
                        <div class="form-group">
                            <label>Pincode *</label>
                            <input type="text" required placeholder="Enter pincode">
                        </div>
                    </form>

                    <h3 style="margin-top: 2rem;">Payment Method</h3>
                    <div class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="payment" value="COD" checked>
                            <span><i class="fas fa-money-bill"></i> Cash on Delivery (COD)</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="UPI">
                            <span><i class="fas fa-mobile-alt"></i> UPI Payment</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="Card">
                            <span><i class="fas fa-credit-card"></i> Credit/Debit Card</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="NetBanking">
                            <span><i class="fas fa-university"></i> Net Banking</span>
                        </label>
                    </div>

                    <button class="btn btn-primary btn-large" onclick="completeOrder()" style="width: 100%; margin-top: 2rem;">
                        <i class="fas fa-check"></i> Place Order
                    </button>
                </div>

                <!-- Order Summary -->
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div id="checkout-items"></div>
                    <div class="summary-total" style="margin-top: 2rem; padding-top: 2rem; border-top: 2px solid #ddd;">
                        <div class="summary-row">
                            <span>Total Amount:</span>
                            <span id="checkout-total" style="font-size: 1.5rem; font-weight: bold; color: #FF6B9D;">₹0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>Contact Info</h4>
                <p>📞 Toll Free: 1800-KIDSMART</p>
                <p>📧 Email: support@kidsmart.in</p>
            </div>
        </div>
    </footer>

    <script src="products-data.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            displayCartItems();
        });
    </script>
</body>
</html>
